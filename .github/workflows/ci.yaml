name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-check:
    name: make fmt-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: make fmt-check

  lint-check:
    name: make lint-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - run: npm install
      - run: make lint-check

  tests:
    name: make test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAINNET_HTTP: ${{ secrets.MAINNET_HTTP }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Huff
        uses: cakevm/huff-neo-toolchain@v1
        with:
          version: latest

      - name: Check src/vm.huff is generated from Vm.sol
        run: make vm-huff-check

      - name: Run Tests
        run: make test

      - name: Run Huff Tests
        run: make test-huff

      # Runs only where the MAINNET_HTTP secret is available
      - name: Run Huff Fork Tests
        if: env.MAINNET_HTTP != ''
        run: make test-huff-fork
